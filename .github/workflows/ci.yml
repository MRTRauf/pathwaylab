name: pathwaylab-tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,app,research]'
      - run: python -m ruff check src app scripts tests
      - run: python -m ruff format --check src app scripts tests
      - run: python -m pip check
      - run: python -c "import pathwaylab.cli, pathwaylab.events, pathwaylab.forecasting"
      - run: pytest -q -m "not integration"
      - run: python -m pathwaylab.cli --mode demo
      - run: python -m pip wheel . --no-deps -w dist

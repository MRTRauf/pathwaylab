[theme]
base = "dark"
primaryColor = "#F4C542"
backgroundColor = "#081B34"
secondaryBackgroundColor = "#173656"
textColor = "#F5F8FC"
borderColor = "#2A4966"
baseFontSize = 16
font = "sans serif"

[theme.sidebar]
primaryColor = "#F4C542"
backgroundColor = "#06162B"
secondaryBackgroundColor = "#102B4A"
